schema: 1
port: libbase64

# SIMD base64 codec; CMake (also ships a hand-written Makefile).
# Static validation is the default; see tests/extra.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
