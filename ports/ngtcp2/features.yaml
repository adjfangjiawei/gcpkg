schema: 1
port: ngtcp2

# QUIC library; `tls` feature pulls in the existing openssl port.
# Feature switches for this port.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  tls:
    default: true
    description: Pull in openssl for this optional capability
    requires: [openssl]
