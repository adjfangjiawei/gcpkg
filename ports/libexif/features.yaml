schema: 1
port: libexif

# EXIF tag parser; GitHub tag ships only configure.ac.
# Static validation is the default; see tests/r10.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
