schema: 1
port: elfutils

# libelf/libdw on zlib + zstd + xz; debuginfod (HTTP server) disabled.
# Feature switches for this port.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
