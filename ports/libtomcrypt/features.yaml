schema: 1
port: libtomcrypt

# Hand-written lowercase makefile; `ltm` feature pulls libtommath.
# Static validation is the default; see tests/r10.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  ltm:
    default: false
    description: Pull in libtommath for this optional capability
    requires: [libtommath]
    args: []
