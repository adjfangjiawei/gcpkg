schema: 1
port: vulkan-headers

# Khronos Vulkan-Headers: header/registry-only CMake install, feeds the loader.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
