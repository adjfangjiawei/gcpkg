schema: 1
port: gn

# GN meta-build tool, built from the pinned timniederhausen/gn mirror.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
