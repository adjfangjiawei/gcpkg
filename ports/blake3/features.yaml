schema: 1
port: blake3

# BLAKE3 C build lives in the c/ subdir (cmake.source).
# Static validation is the default; see tests/r10.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
