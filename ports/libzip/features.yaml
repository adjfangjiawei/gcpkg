schema: 1
port: libzip

# ZIP library on the existing zlib port; `openssl` feature adds openssl.
# Feature switches for this port.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  openssl:
    default: false
    description: Pull in openssl for this optional capability
    requires: [openssl]
