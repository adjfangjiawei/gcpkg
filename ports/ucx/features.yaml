schema: 1
port: ucx

# Autotools; CUDA/ROCm support is optional and comes from the 'nvidia' SDK port when enabled.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
