schema: 1
port: ddt

# ddt 9c93e80 -- R20 new-standard header-only source port.
# The upstream tarball has no build system: gcpkg installs the headers and
# then verifies every default-ON capability for real (Build and RUN the complete usage scenario documented in the upstream README (upstream ships no unit-test suite)).
# No dependency is downloaded and no host header is probed: the port has no
# gcpkg dependencies and every TU is compiled by gcpkg's compiler wrapper.
features:
  headers:
    default: true
    description: Install DataDrivenTest.hpp (include/DataDrivenTest.hpp and include/ddt/DataDrivenTest.hpp) into <prefix>/include
    args: []
  no-headers:
    default: false
    description: Opt out of the public header install
    conflicts: ["headers"]
    args: []
  tests:
    default: true
    description: Build and RUN the complete usage scenario documented in the upstream README (upstream ships no unit-test suite)
    args: []
  no-tests:
    default: false
    description: Opt out of the upstream test run
    conflicts: ["tests"]
    args: []
  pkgconfig:
    default: true
    description: Install lib/pkgconfig/ddt.pc for pkg-config consumers
    args: []
  no-pkgconfig:
    default: false
    description: Opt out of the pkg-config metadata
    conflicts: ["pkgconfig"]
    args: []
  cmake-package:
    default: true
    description: Install a CONFIG package for find_package(ddt CONFIG)
    args: []
  no-cmake-package:
    default: false
    description: Opt out of the CMake CONFIG package
    conflicts: ["cmake-package"]
    args: []
  docs:
    default: true
    description: Install the upstream documentation into share/doc/ddt
    args: []
  no-docs:
    default: false
    description: Opt out of the documentation install
    conflicts: ["docs"]
    args: []
  license:
    default: true
    description: Install the upstream license text into share/doc/ddt
    args: []
  no-license:
    default: false
    description: Opt out of the license install
    conflicts: ["license"]
    args: []
  sanity:
    default: true
    description: Compile and RUN a real consumer that exercises the public API
    args: []
  no-sanity:
    default: false
    description: Opt out of the consumer sanity run
    conflicts: ["sanity"]
    args: []
