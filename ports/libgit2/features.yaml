schema: 1
port: libgit2

# libgit2; real bottom-up zlib dependency, no bundled zlib.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
