schema: 1
port: udisks2

# Widest disk-info dependency surface: glib, dbus, libgudev, libatasmart, libnvme (-> liburing), libparted, util-linux, libacl.
# Static validation is the default; see tests/linux-kernel.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
