schema: 1
port: libnftnl

# ONE feature description per library. Enabled features inject
# build arguments without editing build.lua.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: ["--disable-shared"]
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: ["--enable-shared"]
    conflicts: ["static"]
