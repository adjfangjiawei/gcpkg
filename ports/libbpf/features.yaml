schema: 1
port: libbpf

# Kernel tools/lib/bpf Makefile: build in src/ then install with PREFIX=<prefix>; depends on elfutils.
# Feature switches for this port.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
