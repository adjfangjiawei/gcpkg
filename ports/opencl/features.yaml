schema: 1
port: opencl

# Khronos OpenCL ICD loader linked against source-built OpenCL headers
# License files are installed under share/doc/opencl.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
