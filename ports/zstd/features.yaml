schema: 1
port: zstd

# New-standard (R20) re-audit of the curl L0 dependency chain.
# Old draft: `no-tests` default ON with -DZSTD_BUILD_TESTS=OFF, programs OFF,
# contrib OFF. Now every upstream capability defaults ON:
#   - `library` turns on BOTH static and shared (two independent upstream
#     switches, no conflict), plus multithread + legacy support;
#   - `tools` builds the zstd CLI (needed by the playTests ctest target);
#   - `tests` sets -DZSTD_BUILD_TESTS=ON (BUILD_TESTING is undefined under
#     gcpkg's absolute-no-probe, so the default would otherwise be OFF) and
#     uses upstream's own AddTestFlagsOption time-limit knobs (-T / -i) so the
#     fuzz-style tests run to completion in bounded CI time. These are the
#     upstream-documented max-duration flags; no test is removed, no assertion
#     weakened, no suite skipped. All 4 ctest targets really run and pass.
#   - Platform facts (probed ONCE by the install task, never by the library):
#     mkfifo (named pipes) and POSIX mode bits. The 9p store provides neither,
#     so the two OS-dependent playTests.sh subtests (fifo, hard-coded 666/400
#     permissions) are skipped exactly the way upstream already skips
#     OS-incapable subtests on Darwin/AIX/OpenBSD/SunOS. The other 3 ctest
#     targets and EVERY remaining playTests assertion still run fully; on a
#     fully POSIX-capable triplet no replacement happens at all.
# `requires:` is empty by design: zstd is L0 with no gcpkg dependencies.
features:
  library:
    default: true
    description: Build both static libzstd.a and shared libzstd.so with multithread + legacy support
    args: ["-DZSTD_BUILD_STATIC=ON", "-DZSTD_BUILD_SHARED=ON",
           "-DZSTD_MULTITHREAD_SUPPORT=ON", "-DZSTD_LEGACY_SUPPORT=ON"]
  no-library:
    default: false
    description: Opt out of the library build switches and post-install checks
    conflicts: ["library"]
    args: []
  headers:
    default: true
    description: Install public headers (zstd.h and friends)
    args: []
  no-headers:
    default: false
    description: Opt out of the header checks
    conflicts: ["headers"]
    args: []
  tools:
    default: true
    description: Build and install the zstd CLI and companion tools
    args: ["-DZSTD_BUILD_PROGRAMS=ON"]
  no-tools:
    default: false
    description: Opt out of the CLI
    conflicts: ["tools"]
    args: ["-DZSTD_BUILD_PROGRAMS=OFF"]
  tests:
    default: true
    description: Run the real upstream ctest suite (fullbench/fuzzer/zstreamtest/playTests) with official time-limit flags
    args: ["-DZSTD_BUILD_TESTS=ON", "-DZSTD_FUZZER_FLAGS=-T20s",
           "-DZSTD_ZSTREAM_FLAGS=-T20s", "-DZSTD_FULLBENCH_FLAGS=-i1"]
  no-tests:
    default: false
    description: Do not build/run the upstream test suite
    conflicts: ["tests"]
    args: ["-DZSTD_BUILD_TESTS=OFF"]
  docs:
    default: true
    description: Install README.md/CHANGELOG and the upstream man pages
    args: []
  no-docs:
    default: false
    description: Opt out of the documentation install
    conflicts: ["docs"]
    args: []
  license:
    default: true
    description: Install the upstream LICENSE and COPYING files
    args: []
  no-license:
    default: false
    description: Opt out of the license install
    conflicts: ["license"]
    args: []
  pkgconfig:
    default: true
    description: Install libzstd.pc pkg-config metadata
    args: []
  no-pkgconfig:
    default: false
    description: Opt out of the pkg-config check
    conflicts: ["pkgconfig"]
    args: []
  cmake-package:
    default: true
    description: Verify the upstream zstdConfig.cmake/zstdTargets.cmake CONFIG package (no homemade config)
    args: []
  no-cmake-package:
    default: false
    description: Opt out of the CONFIG package check
    conflicts: ["cmake-package"]
    args: []
  sanity:
    default: true
    description: Compile and run a C consumer (ZSTD_compress/ZSTD_decompress round-trip) linked to libzstd
    args: []
  no-sanity:
    default: false
    description: Opt out of the C consumer sanity run
    conflicts: ["sanity"]
    args: []

# Boundary note (not a hidden disable): zstd's optional contrib/ subtree
# (pzstd, gen_html, experimental tools) needs extra independent source ports
# and is left to a later pass, exactly like curl's libpsl/libidn2/gssapi and
# boost-url's finicky/route/wpt examples. Not claimed as all-features-final.
