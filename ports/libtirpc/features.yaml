schema: 1
port: libtirpc

# TI-RPC; ships ./configure, depends on rpcsvc-proto headers.
# Static validation is the default; see tests/linux-kernel.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
