schema: 1
port: zlib

# Feature switches are DATA: they inject build flags without
# editing build.lua, and are resolved from defaults + project
# gcpkg.yaml + --feature CLI overrides.
features:
  no-examples:
    default: true
    description: Do not build the zlib example programs
    args: ["-DZLIB_BUILD_EXAMPLES=OFF"]
  examples:
    default: false
    description: Build the zlib examples
    args: ["-DZLIB_BUILD_EXAMPLES=ON"]
    conflicts: ["no-examples"]

# Additional upstream releases. `gcpkg add zlib@1.2.13` switches BOTH the
# source tarball and the store key (zlib-1.2.13), so two projects can use
# different zlib versions simultaneously. All four URLs/SHA256 below were
# downloaded and hashed; 1.3.1 and 1.2.13 are really compiled by
# tests/projects.sh (GCPKG_PROJECT_DYNAMIC=1).
versions:
  "1.3.1":
    source:
      url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
      sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
  "1.2.13":
    source:
      url: "https://github.com/madler/zlib/releases/download/v1.2.13/zlib-1.2.13.tar.gz"
      sha256: "b3a24de97a8fdbc835b9833169501030b8977031bcb54b3b3ac13740f846ab30"
  "1.2.12":
    source:
      url: "https://zlib.net/fossils/zlib-1.2.12.tar.gz"
      sha256: "91844808532e5ce316b3c010929493c0244f3d37593afd6de04f71821d5136d9"
  "1.2.11":
    source:
      url: "https://zlib.net/fossils/zlib-1.2.11.tar.gz"
      sha256: "c3e5e9fdd5004dcb542feda5ee4f0ff0744628baf8ed2dd5d66f8ca1197cb1a1"
