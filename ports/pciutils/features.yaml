schema: 1
port: pciutils

# PCI enumeration (lspci) + libpci; hand-written Makefile, install target writes /sbin so build.lua collects artifacts into the prefix.
# Feature switches for this port.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
