schema: 1
port: catch2

# Catch2 v3: two static libs, self-tests off.
# Static validation is the default; see tests/r10.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
