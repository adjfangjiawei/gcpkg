schema: 1
port: libvpx

# VP8/VP9 codec: SIMD configure using the nasm tool port on PATH.
# Feature switches for this port.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
