schema: 1
port: libsrtp

# Secure RTP; `openssl` feature enables the OpenSSL crypto engine.
# Feature switches for this port.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  openssl:
    default: false
    description: Pull in openssl for this optional capability
    requires: [openssl]
    args: ["-DENABLE_OPENSSL=ON"]
