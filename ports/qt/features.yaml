schema: 1
port: qt

# Qt 6 Base static core; bundled third-party sources, no system dev packages
# License files are installed under share/doc/qt.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
