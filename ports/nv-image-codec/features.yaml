schema: 1
port: nv-image-codec

# nvImageCodec requires CUDA >= 12.1 and optionally CV-CUDA (its samples). Both are declared gcpkg ports.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
