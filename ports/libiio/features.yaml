schema: 1
port: libiio

# Industrial I/O kernel interface; CMake, depends on libusb + libxml2. Avahi DNS-SD and libaio are disabled.
# Feature switches for this port.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
