schema: 1
port: glib

# GLib core; Meson, depends on libffi + zlib + pcre2 (existing L0 ports).
# Static validation is the default; see tests/linux-base.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
