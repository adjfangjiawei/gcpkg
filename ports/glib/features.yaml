schema: 1
port: glib

# GLib 2.90.1 upgraded in place; static Meson build on source-built libffi/zlib/pcre2
# License files are installed under share/doc/glib.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
