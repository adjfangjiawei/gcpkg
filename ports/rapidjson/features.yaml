schema: 1
port: rapidjson

# Header-only C++ JSON library: no libraries exported, headers only.
# Feature switches for this port.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
