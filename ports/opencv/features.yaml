schema: 1
port: opencv

# OpenCV core/imgproc/imgcodecs with bundled source-built codec libraries
# License files are installed under share/doc/opencv.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
