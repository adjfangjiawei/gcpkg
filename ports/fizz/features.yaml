schema: 1
port: fizz

# Facebook v2026.10.26.00 release line, same tag as folly/wangle/mvfst/proxygen.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
