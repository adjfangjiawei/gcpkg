schema: 1
port: libssh2

# New-standard (R20) re-audit of the curl L0 dependency chain.
# Old draft: `no-tests` default ON with BUILD_TESTING=OFF, BUILD_EXAMPLES=OFF,
# BUILD_SHARED_LIBS=OFF, static dependencies={"openssl","zlib"} hardcoded in
# build.lua. Every library-level upstream capability that can be built from
# already-installed source ports now defaults ON:
#   - static AND shared libssh2 (the old draft forced them to conflict);
#   - BUILD_TESTING=ON and BUILD_EXAMPLES=ON;
#   - OpenSSL crypto backend and zlib compression are POSITIVE dependencies
#     with dynamic requires, pointing find_package at the source-port prefixes;
#   - docs/license/pkgconfig/cmake-package/sanity verify real upstream files.
# Service-dependent upstream test groups are NOT hidden behind a negative
# feature: pre_build measures docker/sshd/man/port-4711 facts ONCE at install
# start, keeps RUN_SSHD_TESTS ON (upstream test_sshd.test starts its own sshd),
# and sets RUN_DOCKER_TESTS=OFF because there is no persistent OpenSSH server
# at 4711 and docker pull/build during the build is forbidden. OPENSSH_NO_DOCKER=1
# is set for ctest. If test_sshd still fails on a host, post_install records the
# exact capability result and re-runs via the official RUN_SSHD_TESTS switch;
# BUILD_TESTING is never turned off and no ctest -E filter or source patch is
# used. dependencies = {} stays empty in build.lua.
features:
  library:
    default: true
    description: Build the libssh2 library and verify its installed artifacts
    args: []
  no-library:
    default: false
    description: Opt out of the library artifact checks
    conflicts: ["library"]
    args: []
  headers:
    default: true
    description: Install public libssh2 headers
    args: []
  no-headers:
    default: false
    description: Opt out of the header checks
    conflicts: ["headers"]
    args: []
  static:
    default: true
    description: Build and install static libssh2.a
    args: ["-DBUILD_STATIC_LIBS=ON"]
  no-static:
    default: false
    description: Do not build static libssh2.a
    conflicts: ["static"]
    args: ["-DBUILD_STATIC_LIBS=OFF"]
  shared:
    default: true
    description: Build and install shared libssh2.so
    args: ["-DBUILD_SHARED_LIBS=ON"]
  no-shared:
    default: false
    description: Do not build shared libssh2.so
    conflicts: ["shared"]
    args: ["-DBUILD_SHARED_LIBS=OFF"]
  tests:
    default: true
    description: Build and run the real upstream ctest suite; needs static library for upstream static test targets
    conflicts: ["no-static"]
    args: ["-DBUILD_TESTING=ON"]
  no-tests:
    default: false
    description: Do not build/run the upstream ctest suite
    conflicts: ["tests"]
    args: ["-DBUILD_TESTING=OFF"]
  examples:
    default: true
    description: Build all upstream example programs (no external service needed to compile/link)
    args: ["-DBUILD_EXAMPLES=ON"]
  no-examples:
    default: false
    description: Do not build upstream examples
    conflicts: ["examples"]
    args: ["-DBUILD_EXAMPLES=OFF"]
  openssl:
    default: true
    description: Use the separately installed OpenSSL 3.4.1 source port as the CRYPTO_BACKEND (never host OpenSSL)
    requires: ["openssl"]
    args: []
  no-openssl:
    default: false
    description: Opt out of the OpenSSL backend (not a buildable configuration for this port)
    conflicts: ["openssl"]
    args: []
  zlib:
    default: true
    description: Enable upstream zlib compression using the separately installed zlib 1.3.1 source port
    requires: ["zlib"]
    args: ["-DENABLE_ZLIB_COMPRESSION=ON"]
  no-zlib:
    default: false
    description: Disable zlib compression and all zlib discovery
    conflicts: ["zlib"]
    args: ["-DENABLE_ZLIB_COMPRESSION=OFF", "-DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON"]
  debug-logging:
    default: true
    description: Enable upstream LIBSSH2DEBUG trace capability
    args: ["-DENABLE_DEBUG_LOGGING=ON"]
  no-debug-logging:
    default: false
    description: Disable upstream debug logging
    conflicts: ["debug-logging"]
    args: ["-DENABLE_DEBUG_LOGGING=OFF"]
  clear-memory:
    default: true
    description: Keep upstream CLEAR_MEMORY enabled
    args: ["-DCLEAR_MEMORY=ON"]
  no-clear-memory:
    default: false
    description: Disable upstream memory clearing
    conflicts: ["clear-memory"]
    args: ["-DCLEAR_MEMORY=OFF"]
  hide-symbols:
    default: true
    description: Keep upstream HIDE_SYMBOLS enabled
    args: ["-DHIDE_SYMBOLS=ON"]
  no-hide-symbols:
    default: false
    description: Disable upstream symbol hiding
    conflicts: ["hide-symbols"]
    args: ["-DHIDE_SYMBOLS=OFF"]
  picky-compiler:
    default: true
    description: Keep upstream PICKY_COMPILER warnings enabled (ENABLE_WERROR stays OFF)
    args: ["-DPICKY_COMPILER=ON"]
  no-picky-compiler:
    default: false
    description: Disable upstream picky compiler warnings
    conflicts: ["picky-compiler"]
    args: ["-DPICKY_COMPILER=OFF"]
  deprecated-apis:
    default: true
    description: Keep deprecated public APIs available (LIBSSH2_NO_DEPRECATED=OFF)
    args: ["-DLIBSSH2_NO_DEPRECATED=OFF"]
  no-deprecated-apis:
    default: false
    description: Remove deprecated public APIs
    conflicts: ["deprecated-apis"]
    args: ["-DLIBSSH2_NO_DEPRECATED=ON"]
  docs:
    default: true
    description: Install the 186 upstream man3 pages and the upstream document files
    args: []
  no-docs:
    default: false
    description: Opt out of the documentation checks
    conflicts: ["docs"]
    args: []
  license:
    default: true
    description: Verify the upstream COPYING/NEWS/README/RELEASE-NOTES/AUTHORS/BINDINGS/HACKING install
    args: []
  no-license:
    default: false
    description: Opt out of the license/document checks
    conflicts: ["license"]
    args: []
  pkgconfig:
    default: true
    description: Verify libssh2.pc and run an independent CMake FindPkgConfig consumer
    args: []
  no-pkgconfig:
    default: false
    description: Opt out of the pkg-config checks
    conflicts: ["pkgconfig"]
    args: []
  cmake-package:
    default: true
    description: Verify the upstream libssh2-config.cmake CONFIG package and exported targets (no homemade config)
    args: []
  no-cmake-package:
    default: false
    description: Opt out of the CONFIG package checks
    conflicts: ["cmake-package"]
    args: []
  sanity:
    default: true
    description: Compile and run a C consumer linked to installed libssh2, source-port OpenSSL and source-port zlib
    args: []
  no-sanity:
    default: false
    description: Opt out of the C consumer sanity run
    conflicts: ["sanity"]
    args: []

# Boundary note: CRYPTO_BACKEND is pinned to OpenSSL. Optional host backends
# (WolfSSL/Libgcrypt/mbedTLS), LINT and ENABLE_WERROR stay OFF; CMake's user
# package registry writes are disabled with CMAKE_EXPORT_NO_PACKAGE_REGISTRY.
# This is not P2-all-features-final and not the 346-ports final audit.
