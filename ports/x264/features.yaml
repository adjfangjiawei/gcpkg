schema: 1
port: x264

# x264 static encoder pinned to latest upstream snapshot, source-built for FFmpeg
# License files are installed under share/doc/x264.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
