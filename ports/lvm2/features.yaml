schema: 1
port: lvm2

# device-mapper / LVM2; configure in tarball, depends on util-linux + libaio.
# Feature switches for this port.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
