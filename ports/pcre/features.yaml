schema: 1
port: pcre

# Legacy PCRE (complements the existing pcre2 port).
# Static validation is the default; see tests/extra.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
