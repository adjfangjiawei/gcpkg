schema: 1
port: lame

# LAME 3.100 static MP3 encoder source port for FFmpeg
# License files are installed under share/doc/lame.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
