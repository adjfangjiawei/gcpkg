schema: 1
port: hidapi

# HID device access; CMake over libusb. Static build avoids linking the non-PIC libusb-1.0.a into a .so.
# Feature switches for this port.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
