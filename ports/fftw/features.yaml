schema: 1
port: fftw

# FFTW3 discrete Fourier transform library; single-thread static build.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
