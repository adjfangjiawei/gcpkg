schema: 1
port: openal

# OpenAL Soft static library with source-built SDL3/ALSA backends and Wave/Null
# License files are installed under share/doc/openal.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
