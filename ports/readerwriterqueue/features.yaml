schema: 1
port: readerwriterqueue

# Header-only SPSC C++ queue; two real upstream test TUs are compiled for compdb.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
