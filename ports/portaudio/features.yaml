schema: 1
port: portaudio

# Portable audio I/O; `alsa` feature pulls the alsa-lib port.
# Static validation is the default; see tests/r10.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  alsa:
    default: false
    description: Pull in alsa-lib for this optional capability
    requires: [alsa-lib]
    args: ["-DPA_USE_ALSA=ON"]
