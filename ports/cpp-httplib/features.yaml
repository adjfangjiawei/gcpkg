schema: 1
port: cpp-httplib

# Header-only HTTP/HTTPS library; `tls` feature pulls openssl + zlib.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  tls:
    default: true
    description: Enable openssl, zlib
    requires: [openssl, zlib]
    args: ["-DHTTPLIB_REQUIRE_OPENSSL=ON", "-DHTTPLIB_REQUIRE_ZLIB=ON"]
