schema: 1
port: libunwind

# Stack unwinding; upstream CMakeLists.txt is Visual-Studio-only, so the autotools build is used (tag archive needs autoreconf).
# Feature switches for this port.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
