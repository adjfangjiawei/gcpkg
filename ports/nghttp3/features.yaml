schema: 1
port: nghttp3

# HTTP/3 library; library-only CMake build.
# Static validation is the default; see tests/extra.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
