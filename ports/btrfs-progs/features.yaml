schema: 1
port: btrfs-progs

# Btrfs tools on util-linux/zlib/zstd/lz4; tag archive needs autogen.sh.
# Static validation is the default; see tests/linux-kernel.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
