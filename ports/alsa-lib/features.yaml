schema: 1
port: alsa-lib

# Autotools. Host ALSA headers via pkgconfig backend; --disable-python avoids Python SWIG bindings.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
