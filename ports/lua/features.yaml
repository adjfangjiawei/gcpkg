schema: 1
port: lua

# GitHub mirror makefile: build liblua.a + lua, then install headers/library/binary. CC is forced to gcpkg-intercept so compdb is produced.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
