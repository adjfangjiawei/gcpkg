schema: 1
port: onetbb

# oneTBB; `python` feature enables the optional Python module.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  python:
    default: true
    description: Enable python
    requires: [python]
    args: ["-DTBB4PY_BUILD=ON"]
