schema: 1
port: meshoptimizer

# Mesh optimization; static library and public header only.
features:
  no-tests:
    default: false
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
