schema: 1
port: libass

# libass static subtitle renderer on source-built font/shaping ports
# License files are installed under share/doc/libass.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
