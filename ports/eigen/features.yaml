schema: 1
port: eigen

# Header-only linear algebra; headers land in include/eigen3.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
