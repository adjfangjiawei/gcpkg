schema: 1
port: zuri

# pascaldekloe/zuri @ b2fddbf: strict URI library written in Zig, consumed by
# ada 2.9.2 through the C ABI in zuri.h.  Every capability implemented by this
# source port is ON by default.  Zig comes from the source/tool port `zig`
# through dynamic feature `requires`, so no host Zig is used.
features:
  library:
    default: true
    description: Build all upstream zig build installArtifact outputs (libzuri.a, cross libs, bench, fuzzers)
    requires: ["zig"]
    args: []
  no-library:
    default: false
    description: Opt out of the Zig build artifacts
    conflicts: ["library"]
    args: []
  headers:
    default: true
    description: Install the C ABI header zuri.h
    args: []
  no-headers:
    default: false
    description: Opt out of zuri.h
    conflicts: ["headers"]
    args: []
  cmake-package:
    default: true
    description: Install upstream package/zuri-config.cmake with the zuri imported target
    args: []
  no-cmake-package:
    default: false
    description: Opt out of the CMake CONFIG package
    conflicts: ["cmake-package"]
    args: []
  license:
    default: true
    description: Install LICENSE
    args: []
  no-license:
    default: false
    description: Opt out of LICENSE
    conflicts: ["license"]
    args: []
  tests:
    default: true
    description: Run zig build -j1 test (unit tests and fuzz sample quick-checks)
    requires: ["zig"]
    args: []
  no-tests:
    default: false
    description: Opt out of the upstream Zig tests
    conflicts: ["tests"]
    args: []
  examples:
    default: true
    description: Build the upstream demo.c C ABI example
    requires: ["zig"]
    args: []
  no-examples:
    default: false
    description: Opt out of demo.c
    conflicts: ["examples"]
    args: []
  sanity:
    default: true
    description: Run demo.c as a real C consumer linked against libzuri.a
    requires: ["zig"]
    args: []
  no-sanity:
    default: false
    description: Opt out of the real C sanity run
    conflicts: ["sanity"]
    args: []
