schema: 1
port: abseil

# R20: every feature supported on the active triplet is ON by default.
# The testing feature needs the source-built googletest port (bottom-up).
features:
  tests:
    default: true
    description: Build Abseil's own test suite (googletest source port)
    args: []
  no-tests:
    default: false
    description: Opt out of the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
