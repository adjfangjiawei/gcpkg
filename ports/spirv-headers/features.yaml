schema: 1
port: spirv-headers

# Khronos SPIR-V headers.  Upstream CMakeLists.txt declares exactly two
# options; both default ON (upstream defaults them to PROJECT_IS_TOP_LEVEL) and
# each has an explicit opt-out twin.  `install` is what makes the headers, the
# CONFIG package and the generated SPIRV-Headers.pc appear, so the pkgconfig and
# cmake-package checks are tied to it.
features:
  install:
    default: true
    description: "Install include/spirv/** plus upstream's CONFIG package and generated SPIRV-Headers.pc (SPIRV_HEADERS_ENABLE_INSTALL=ON)"
    args: ["-DSPIRV_HEADERS_ENABLE_INSTALL=ON"]
  no-install:
    default: false
    description: "Opt out of the install capability (same switch as above, reversed)"
    conflicts: ["install"]
    args: ["-DSPIRV_HEADERS_ENABLE_INSTALL=OFF"]
  tests:
    default: true
    description: "Build and run the upstream tests (SPIRV_HEADERS_ENABLE_TESTS=ON): the same program as C99, C++98 and C++11 with SPV_ENABLE_UTILITY_CODE, 3 CTest entries"
    args: ["-DSPIRV_HEADERS_ENABLE_TESTS=ON"]
  no-tests:
    default: false
    description: "Opt out of the tests capability (same switch as above, reversed)"
    conflicts: ["tests"]
    args: ["-DSPIRV_HEADERS_ENABLE_TESTS=OFF"]
  pkgconfig:
    default: true
    description: "Assert upstream's SPIRV-Headers.pc is installed (share/pkgconfig), generated by upstream's CMake. Needs install; the port fails loudly if install is off"
    args: []
  no-pkgconfig:
    default: false
    description: Opt out of the pkg-config check
    conflicts: ["pkgconfig"]
    args: []
  cmake-package:
    default: true
    description: "Assert upstream's CONFIG package is installed (find_package(SPIRV-Headers CONFIG) -> SPIRV-Headers::SPIRV-Headers). Needs install; the port fails loudly if install is off"
    args: []
  no-cmake-package:
    default: false
    description: Opt out of the CONFIG package check
    conflicts: ["cmake-package"]
    args: []
  sanity:
    default: true
    description: "Compile, link and run a consumer against the INSTALLED headers (enum values + OpToString utility code). Needs install; the port fails loudly if install is off"
    args: []
  no-sanity:
    default: false
    description: Opt out of the installed-tree consumer check
    conflicts: ["sanity"]
    args: []
  docs:
    default: true
    description: "Install README.md, CHANGES and the upstream docs/ folder into share/doc/spirv-headers"
    args: []
  no-docs:
    default: false
    description: Opt out of the documentation install
    conflicts: ["docs"]
    args: []
  license:
    default: true
    description: "Install LICENSE and the REUSE LICENSES/ tree into share/doc/spirv-headers"
    args: []
  no-license:
    default: false
    description: Opt out of the license install
    conflicts: ["license"]
    args: []
