schema: 1
port: dlib

# dlib static library using source-built JPEG/PNG/zlib ports, no GUI/CUDA/BLAS
# License files are installed under share/doc/dlib.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
