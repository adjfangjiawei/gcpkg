schema: 1
port: cares

# New-standard (R20) re-audit of the curl L0 dependency chain.
# Old draft: `no-tests` default ON with -DBUILD_TESTING=OFF (an option c-ares
# does not even read), plus CARES_BUILD_TOOLS=OFF hardcoded in build.lua and
# static-only switches. Now every upstream capability defaults ON:
#   - `library` turns on BOTH CARES_STATIC and CARES_SHARED (two independent
#     upstream options; on Unix they produce libcares.a and libcares.so
#     without a name conflict), plus thread-safety and install targets;
#   - `tools` builds/installs the upstream adig/ahost CLI (was hardcoded OFF);
#   - `tests` sets -DCARES_BUILD_TESTS=ON (the option upstream actually reads)
#     and dynamically requires the googletest source port via `requires:`,
#     because upstream test/CMakeLists.txt calls find_package(GTest REQUIRED)
#     and links GTest::gmock. All 3 registered ctest targets really run.
# No negative `no-*` feature is ON by default. `dependencies = {}` stays empty
# in build.lua: the only dependency is decided dynamically by features.yaml.
features:
  library:
    default: true
    description: Build both static libcares.a and shared libcares.so with thread safety
    args: ["-DCARES_STATIC=ON", "-DCARES_SHARED=ON",
           "-DCARES_INSTALL=ON", "-DCARES_THREADS=ON"]
  no-library:
    default: false
    description: Opt out of the library build switches and post-install checks
    conflicts: ["library"]
    args: []
  headers:
    default: true
    description: Install public headers (ares.h and friends)
    args: []
  no-headers:
    default: false
    description: Opt out of the header checks
    conflicts: ["headers"]
    args: []
  tools:
    default: true
    description: Build and install the upstream adig/ahost command-line tools
    args: ["-DCARES_BUILD_TOOLS=ON"]
  no-tools:
    default: false
    description: Opt out of the CLI tools
    conflicts: ["tools"]
    args: ["-DCARES_BUILD_TOOLS=OFF"]
  tests:
    default: true
    description: Run the real upstream ctest suite (arestest/aresfuzz/aresfuzzname) with GTest/GMock
    requires: ["googletest"]
    args: ["-DCARES_BUILD_TESTS=ON"]
  no-tests:
    default: false
    description: Do not build/run the upstream test suite
    conflicts: ["tests"]
    args: ["-DCARES_BUILD_TESTS=OFF"]
  docs:
    default: true
    description: Install README/RELEASE-NOTES/INSTALL docs alongside the upstream man pages
    args: []
  no-docs:
    default: false
    description: Opt out of the documentation install
    conflicts: ["docs"]
    args: []
  license:
    default: true
    description: Install the upstream LICENSE.md and AUTHORS
    args: []
  no-license:
    default: false
    description: Opt out of the license install
    conflicts: ["license"]
    args: []
  pkgconfig:
    default: true
    description: Install libcares.pc pkg-config metadata
    args: []
  no-pkgconfig:
    default: false
    description: Opt out of the pkg-config check
    conflicts: ["pkgconfig"]
    args: []
  cmake-package:
    default: true
    description: Verify the upstream c-ares-config.cmake CONFIG package (no homemade config)
    args: []
  no-cmake-package:
    default: false
    description: Opt out of the CONFIG package check
    conflicts: ["cmake-package"]
    args: []
  sanity:
    default: true
    description: Compile and run a C consumer (ares_library_init / ares_version) linked to libcares
    args: []
  no-sanity:
    default: false
    description: Opt out of the C consumer sanity run
    conflicts: ["sanity"]
    args: []

# Boundary note (not a hidden disable): c-ares' optional container tests
# (CARES_BUILD_CONTAINER_TESTS, Linux user/UTS namespaces) and any external
# DNS-dependent live cases are platform-capability questions handled by the
# install task's facts, not by turning off CARES_BUILD_TESTS. Not claimed as
# P2 all-features-final or 346-ports final audit.
