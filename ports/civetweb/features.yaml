schema: 1
port: civetweb

# Embeddable web server; static C and C++ wrappers, SSL/tests/tools off.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
