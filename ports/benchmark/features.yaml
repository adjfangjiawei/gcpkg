schema: 1
port: benchmark

# R20 new-standard re-audit of Ada's old benchmark dependency.  The previous
# draft had `no-tests` default ON, static-only, BENCHMARK_ENABLE_TESTING=OFF,
# BENCHMARK_ENABLE_GTEST_TESTS=OFF and BENCHMARK_USE_BUNDLED_GTEST=ON.  This
# port now exposes positive capabilities default ON; googletest and python
# are dynamic source-port dependencies gated by the features that need them.
#
# Upstream has one BUILD_SHARED_LIBS switch, so static and shared are built
# by TWO official configure/build/install passes in the same isolated build
# directory, with the two compile_commands.json arrays merged in place.  The
# first pass also runs a capability ctest with upstream assembly tests ON.
# Those three tests are tied to Clang 5.0.0/GCC 5.5.0 assembly patterns and
# are not applicable to this toolchain; only when the measured capability run
# proves that exactly those assembly tests fail does the port use upstream's
# official BENCHMARK_ENABLE_ASSEMBLY_TESTS=OFF gate for the final two passes.
# No ctest -E, source patch, test-number blacklist or hand-written CONFIG.
#
# BENCHMARK_ENABLE_LIBPFM is OFF because libpfm is not a re-audited source
# port; BENCHMARK_ENABLE_DOXYGEN is OFF because the installed docs are the
# upstream source docs, not generated HTML; LTO/libc++ are toolchain modes
# outside this source-port audit.  They are explicit boundaries, not default-ON
# negative features.
features:
  library:
    default: true
    description: Build and install the upstream benchmark libraries and verify their artifacts
    args: ["-DBENCHMARK_ENABLE_INSTALL=ON"]
  no-library:
    default: false
    description: Opt out of building and installing the libraries
    args: []
    conflicts: ["library"]
  headers:
    default: true
    description: Install the upstream public benchmark headers and verify key headers
    args: []
  no-headers:
    default: false
    description: Opt out of installing public headers
    args: []
    conflicts: ["headers"]
  static:
    default: true
    description: Install libbenchmark.a and libbenchmark_main.a from the official static pass
    args: []
  no-static:
    default: false
    description: Opt out of the static-library pass
    args: []
    conflicts: ["static"]
  shared:
    default: true
    description: Install versioned libbenchmark.so and libbenchmark_main.so from the official shared pass
    args: []
  no-shared:
    default: false
    description: Opt out of the shared-library pass
    args: []
    conflicts: ["shared"]
  tests:
    default: true
    description: Register and run the upstream benchmark ctest suite in both static and shared passes
    requires: ["googletest"]
    args: ["-DBUILD_TESTING=ON", "-DBENCHMARK_ENABLE_TESTING=ON"]
  no-tests:
    default: false
    description: Opt out of the upstream ctest suite
    args: []
    conflicts: ["tests"]
  gtest-tests:
    default: true
    description: Build and run the ten upstream GoogleTest unit tests against source-built GoogleTest
    requires: ["googletest"]
    args: ["-DBENCHMARK_ENABLE_GTEST_TESTS=ON", "-DBENCHMARK_USE_BUNDLED_GTEST=OFF"]
  no-gtest-tests:
    default: false
    description: Opt out of the upstream GoogleTest unit tests
    args: []
    conflicts: ["gtest-tests"]
  exceptions:
    default: true
    description: Keep upstream C++ exceptions enabled
    args: ["-DBENCHMARK_ENABLE_EXCEPTIONS=ON"]
  no-exceptions:
    default: false
    description: Opt out of C++ exceptions
    args: []
    conflicts: ["exceptions"]
  threads:
    default: true
    description: Build with the measured host pthread primitive and source-only Threads facts
    args: ["-DTHREADS_PREFER_PTHREAD_FLAG=ON"]
  no-threads:
    default: false
    description: Opt out of pthread support
    args: []
    conflicts: ["threads"]
  pkgconfig:
    default: true
    description: Install and verify the two upstream pkg-config files
    args: []
  no-pkgconfig:
    default: false
    description: Opt out of pkg-config verification
    args: []
    conflicts: ["pkgconfig"]
  cmake-package:
    default: true
    description: Install and verify the upstream benchmark CMake CONFIG package
    args: []
  no-cmake-package:
    default: false
    description: Opt out of CMake CONFIG verification
    args: []
    conflicts: ["cmake-package"]
  docs:
    default: true
    description: Install the upstream source documentation
    args: ["-DBENCHMARK_INSTALL_DOCS=ON"]
  no-docs:
    default: false
    description: Opt out of installing upstream docs
    args: []
    conflicts: ["docs"]
  license:
    default: true
    description: Install the upstream LICENSE into the documentation directory
    args: []
  no-license:
    default: false
    description: Opt out of installing the license
    args: []
    conflicts: ["license"]
  python-tools:
    default: true
    description: Install and byte-compile the two upstream Python tools with source-built Python
    requires: ["python"]
    args: []
  no-python-tools:
    default: false
    description: Opt out of installing upstream Python tools
    args: []
    conflicts: ["python-tools"]
  consumers:
    default: true
    description: Configure, build and run independent upstream CONFIG and FindPkgConfig CMake consumers
    args: []
  no-consumers:
    default: false
    description: Opt out of independent CMake consumers
    args: []
    conflicts: ["consumers"]
  sanity:
    default: true
    description: Compile and run direct static and shared C++ benchmark sanity binaries
    args: []
  no-sanity:
    default: false
    description: Opt out of direct C++ sanity binaries
    args: []
    conflicts: ["sanity"]
