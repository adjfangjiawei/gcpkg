schema: 1
port: mosquitto

# MQTT client library; `tls` feature enables OpenSSL.
# Static validation is the default; see tests/r10.sh.
features:
  no-tests:
    default: true
    description: Skip the upstream test suite
    args: []
  static:
    default: true
    description: Build static libraries
    args: []
    conflicts: ["shared"]
  shared:
    default: false
    description: Build shared libraries
    args: []
    conflicts: ["static"]
  tls:
    default: false
    description: Pull in openssl for this optional capability
    requires: [openssl]
    args: ["-DWITH_TLS=ON"]
